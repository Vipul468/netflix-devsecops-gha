apiVersion: apps/v1
kind: Deployment
metadata:
  name: netflix-clone
  namespace: netflix
  labels:
    app: netflix-clone
spec:
  replicas: 2
  selector:
    matchLabels:
      app: netflix-clone
  template:
    metadata:
      labels:
        app: netflix-clone
    spec:
      containers:
        - name: netflix-clone
          # This line is updated automatically by the CD (GitOps) workflow.
          image: YOUR_DOCKERHUB_USERNAME/netflix-clone:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: false     # nginx:alpine master needs root to bind :80
            readOnlyRootFilesystem: false
